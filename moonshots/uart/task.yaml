version: 1
id: ring0_uart_rescue
title: Build a resilient ring-0 UART telemetry bridge
max_steps: 40
timeout_seconds: 900
prompt: |
  Build a working interrupt-driven COM1 telemetry driver in TempleOS, using
  HolyC through this desktop. You have unrestricted ring-0 access in this
  disposable VM. COM1 is a QEMU 16550 UART at ports 0x3F8..0x3FF, IRQ4,
  interrupt vector 0x24. The device has a host serial connection. Configure
  115200 baud, 8 data bits, no parity, one stop bit. Preserve normal keyboard,
  mouse, timer and scheduler operation.

  Write B:/Bench/Telemetry.HC, compile it, and start a background service.
  Use a real RX interrupt handler and a bounded buffer; do not busy-poll RX
  in a foreground loop. TempleOS supports InU8, OutU8, IntEntrySet, and
  interrupt U0 handlers. The PIC IRQ4 mask is bit 4 at port 0x21; acknowledge
  serviced IRQs with OutU8(0x20,0x20). Keep the shell usable while serving.

  Wire protocol (all values are bytes unless stated):
  Request = A5, sequence, length, payload[length], checksum.
  Length is 1..64. Checksum is (sequence+length+sum(payload)) modulo 256.
  Valid payloads may contain any byte, including A5 and zero.
  Reply = 5A, sequence, CRC32(payload) as FOUR little-endian bytes, checksum.
  Reply checksum is (sequence+sum(the four CRC bytes)) modulo 256.
  CRC32 is standard IEEE reflected CRC32, polynomial 0xEDB88320, initial
  value 0xFFFFFFFF, final XOR 0xFFFFFFFF (compatible with zlib.crc32).

  Do not reply to corrupt checksums or lengths outside 1..64. Recover to
  accept the next valid frame. Handle byte fragments, long idle gaps, and
  bursts of back-to-back frames. No startup banner or other text should be
  emitted on the serial connection. It is fine to print diagnostics locally.

  Provide BenchStart() and BenchStop() functions. Start the service before
  finishing. BenchStop must stop it and restore the previous interrupt
  vector, PIC IRQ4 mask bit, and UART state as far as the hardware permits.
  Save the code on the writable B: RAM drive; the boot drive is read-only.
  Source execution uses #include "B:/Bench/Telemetry.HC"; with a semicolon.

  Once you finish, the host will send fresh binary challenges and measure
  actual serial responses. Printing a success marker earns no reward.
reward:
  telemetry_weight: 0.9
  responsive_desktop_weight: 0.1
  desktop_credit_requires_a_valid_telemetry_response: true
  verification: host_serial_bytes
  irq_only_verification: requires_additional_causal_instrumentation
