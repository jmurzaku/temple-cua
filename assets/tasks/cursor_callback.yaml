version: 1
id: cursor_callback
title: Live cursor callback
prompt: "At the TempleOS shell, JIT-compile this exact callback:\n\nU0 Cross(CTask\
  \ *, CDC *dc) {\n  dc->color=YELLOW;\n  GrLine(dc,ms.pos.x-16,ms.pos.y,ms.pos.x+16,ms.pos.y);\n\
  \  GrLine(dc,ms.pos.x,ms.pos.y-16,ms.pos.x,ms.pos.y+16);\n}\n\nInstall it with Fs->draw_it=&Cross;.\
  \ Move the pointer to at least two\ndistinct positions and observe the live yellow\
  \ cross following it.\nRight-click in the top menu bar, open the built-in help index,\
  \ and click\nits Command Line documentation link. Keep the same callback installed\n\
  throughout; do not clear, replace, or reinstall it.\nMove the pointer to two distinct\
  \ positions over the opened document.\nFinish with Command Line Overview open and\
  \ the cross still following\nthe pointer over the document.\n"
grader:
  type: manual
  rubric: 'Review the full trajectory. The exact anonymous-CTask callback must

    compile in the live shell and be installed using Fs->draw_it=&Cross.

    A live yellow cross must appear at two pointer positions before and

    after opening the document, moving by the same delta as the pointer.

    Allow the stock bordered fixture''s measured +8,+16 rendering offset.

    The trajectory must include a right-click over the top menu bar with

    a visible pulldown, then the help index and an actual clicked link to

    Command Line Overview. That document must remain open at completion.

    TempleOS exposes the top menu on hover; a desktop context menu is not

    required.

    The callback must not be cleared, replaced, reinstalled after navigation,

    or reproduced as a static image. Menus may cover the cross where they

    overlap because they render later; this does not imply callback removal.

    A screenshot alone cannot prove the callback remains live. Review its

    movement across the full trajectory; this task has no automatic pass score.

    '
category: graphics
difficulty: medium
max_steps: 40
timeout_seconds: 240
setup: []
