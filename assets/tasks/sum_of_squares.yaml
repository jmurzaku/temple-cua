version: 1
id: sum_of_squares
title: Sum the first twelve squares with a loop
prompt: 'In the TempleOS command line, write and execute HolyC code that uses a loop

  to sum n*n for every integer n from 1 through 12, inclusive.

  Print BENCH_SUM= followed immediately by the decimal result and a newline.

  Leave the output visible and finish. Use a loop rather than a closed formula.

  '
grader:
  type: ocr
  crop:
  - 8
  - 16
  - 624
  - 456
  case_sensitive: true
  match_mode: line
  all:
  - BENCH_SUM=650
category: holyc
difficulty: medium
max_steps: 40
timeout_seconds: 180
setup: []
