version: 1
id: cursor_callback
title: TEST ONLY - live shell cursor callback across documentation
category: gui
difficulty: medium
prompt: |
  This is an opt-in diagnostic test, not part of the starter task suite.
  At the TempleOS shell, JIT-compile this exact callback:

  U0 Cross(CTask *, CDC *dc) {
    dc->color=YELLOW;
    GrLine(dc,ms.pos.x-16,ms.pos.y,ms.pos.x+16,ms.pos.y);
    GrLine(dc,ms.pos.x,ms.pos.y-16,ms.pos.x,ms.pos.y+16);
  }

  Install it with Fs->draw_it=&Cross;. Move the pointer to at least two
  distinct positions and observe the live yellow cross following it.
  Right-click in the top menu bar and observe its pulldown menu. TempleOS
  exposes that menu on hover; this is not a desktop context-menu test.
  Move away from the menu, open the built-in help index, and click its
  Command Line documentation link (use Enter to activate the selected link
  if needed). Keep the same callback installed throughout these operations.
  Move the pointer to two distinct positions over the opened document.
  Finish with Command Line Overview open and the yellow cross still live.

  Preserve the exact callback rather than correcting its coordinates.
  GrLine uses task-relative coordinates: on the standard maximized bordered
  fixture, this code follows the pointer with an offset of +8 pixels in x
  and +16 pixels in y. It need not be centered on the pointer.
max_steps: 40
timeout_seconds: 240
grader:
  type: manual
  rubric: |
    Review the full trajectory. The exact anonymous-CTask callback must
    compile in the live shell and be installed using Fs->draw_it=&Cross.
    A live yellow cross must appear at two pointer positions before and
    after opening the document, moving by the same delta as the pointer.
    Allow the stock bordered fixture's measured +8,+16 rendering offset.
    The trajectory must include a right-click over the top menu bar with
    a visible pulldown, then the help index and an actual clicked link to
    Command Line Overview. That document must remain open at completion.
    The callback must not be cleared, replaced, reinstalled after navigation,
    or reproduced as a static image. Menus may cover the cross where they
    overlap because they render later; this does not imply callback removal.
    A screenshot alone cannot prove the callback remains live. This fixture
    requires human review and must never receive an automatic pass score.
