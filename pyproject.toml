[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temple-cua"
version = "0.1.0"
description = "A screenshot-based computer-use evaluation harness for TempleOS"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "Pillow>=10", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
cua = ["cua-agent==0.9.0"]

[project.scripts]
temple-cua = "temple_cua.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires QEMU and a TempleOS ISO"]
