[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temple-cua"
version = "0.1.0"
description = "TempleOSBench: computer-use tasks in TempleOS"
requires-python = ">=3.11,<3.14"
dependencies = ["cua-agent==0.9.0", "httpx>=0.27,<1", "Pillow>=10", "PyYAML>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
temple-cua = "temple_cua.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires QEMU and a TempleOS ISO"]
